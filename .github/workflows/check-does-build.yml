# === Auto-updated by ChatGPT: adds artifact upload for all built JARs ===
name: check-does-build

on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Gradle build
        run: ./gradlew -I init.gradle build

      # 🟩 Upload every built JAR from any Gradle subproject
      - name: Upload built jars (all modules)
        uses: actions/upload-artifact@v4
        with:
          name: voxy-built-jars-${{ github.ref_name }}-${{ github.sha }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
